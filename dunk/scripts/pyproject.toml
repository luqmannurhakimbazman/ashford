[project]
name = "dunk-local-store-tooling"
version = "0.1.0"
description = "Authoritative local store with portable bounded syllabus extraction for Dunk"
requires-python = ">=3.10"
dependencies = [
    "pypdf==6.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
# Matches the repository lint standard enforced by egg/scripts/python-lint.sh.
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Test functions document themselves through descriptive test names; a docstring
# on each one would only restate the name. Production code is not exempt.
"tests/*.py" = ["D103"]
